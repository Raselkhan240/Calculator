<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dollar to BDT Calculator</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:#f0f1f3;font-family:Arial,sans-serif;color:#222}
.wrap{max-width:1050px;margin:auto}.card,.summary{background:#fff;border:1px solid #d8d8d8;border-radius:14px}.card{overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:13px 14px}.title{font-size:20px;font-weight:700}
.addwrap{position:relative}.topbtn{width:34px;height:34px;padding:0;background:#333;font-size:22px}
.menu{display:none;position:absolute;right:0;top:40px;z-index:50;background:#fff;border:1px solid #ccc;border-radius:9px;padding:5px;min-width:150px;box-shadow:0 5px 15px rgba(0,0,0,.15)}
.menu.open{display:block}.menu button{display:block;width:100%;text-align:left;background:#fff;color:#222;border:0;padding:8px 10px;border-radius:6px;font-size:13px}.menu button:hover{background:#eee}
.head,.account{display:grid;grid-template-columns:1.55fr 1.55fr .42fr 1fr 1.25fr .4fr;gap:7px;align-items:center}
.head{padding:7px 12px;background:#f3f4f5;color:#777;font-size:10px;font-weight:700}
.group{border-top:1px solid #e4e4e4}.grouphead{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#fafafa}
.groupname{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}.appicon{width:28px;height:28px;border-radius:6px;background:#666;display:flex;align-items:center;justify-content:center}.appicon:before{content:"";width:16px;height:11px;border:2px solid #fff;border-radius:2px}
.add{width:30px;height:30px;padding:0;border-radius:7px;font-size:20px;background:#333;color:#fff;border:0}
.account{margin-left:42px;padding:6px 12px 6px 0;border-top:1px solid #eee;min-height:50px}.accountname{font-size:12px;font-weight:700}
.amountbox{display:flex;align-items:center;gap:5px}.usd{min-width:0;flex:1}.plusadd{display:none;width:30px;height:30px;padding:0;background:#fff;color:#222;border:1px solid #ccc;border-radius:7px;font-size:20px}.plusadd.show{display:block}
input{width:100%;height:34px;border:1px solid #ccd0d5;border-radius:7px;padding:4px 7px;font-size:14px;outline:none}.equals{height:34px;background:#f1f2f3;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}.total{font-size:13px;font-weight:700;white-space:nowrap}
.del{width:30px;height:30px;padding:0;background:#fff;color:#555;border:1px solid #ddd;border-radius:7px;font-size:17px}
.summary{margin-top:12px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:9px}.box{background:#f3f4f5;border-radius:9px;padding:10px}.box small{color:#777;font-size:10px}.big{font-size:21px;font-weight:800;margin-top:2px}.reset{margin-top:9px;background:#333;color:#fff;border:0;border-radius:8px;padding:9px 13px;font-weight:700}
@media(max-width:650px){.head,.account{grid-template-columns:1.45fr 1.55fr .35fr .9fr 1.05fr .3fr;gap:4px;padding:6px}.account{margin-left:28px}.head{font-size:8px}.accountname{font-size:10px}.groupname{font-size:12px}.appicon{width:24px;height:24px}.appicon:before{width:13px;height:8px}input{height:32px;font-size:12px}.equals{height:32px;font-size:11px}.total{font-size:10px}.title{font-size:18px}.summary{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<div class="top"><div class="title">Dollar to BDT Calculator</div><div class="addwrap"><button class="topbtn" id="addApp">+</button><div class="menu" id="appMenu"></div></div></div>
<div class="head"><div>APP / ACCOUNT</div><div>DOLLAR ($)</div><div>=</div><div>RATE BDT</div><div>TOTAL BDT</div><div>ACTION</div></div>
<div id="groups"></div>
</div>
<div class="summary"><div class="box"><small>TOTAL USD</small><div class="big" id="usdTotal">$0.00</div></div><div class="box"><small>GRAND TOTAL BDT</small><div class="big" id="bdtTotal">BDT 0.00</div></div></div>
<button class="reset" id="reset">Reset All</button>
</div>
<script>
(function(){
var defaultApps=["Zelle","Cash App","Venmo","PayPal","Chime","Apple Pay"];
var groups=document.getElementById("groups"),menu=document.getElementById("appMenu");

function fmtBDT(n){return "BDT "+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtUSD(n){return "$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function parsePlus(v){v=String(v||"").replace(/\s/g,"");if(!v)return 0;if(!/^\d*\.?\d+(?:\+\d*\.?\d+)*$/.test(v))return 0;return v.split("+").reduce(function(s,x){return s+Number(x)},0)}

function createAccount(group,name){
 var box=group.querySelector(".accounts"), n=box.children.length+1, a=document.createElement("div");
 a.className="account";
 a.innerHTML='<b class="accountname"></b><div class="amountbox"><input class="usd" type="text" inputmode="decimal" placeholder="20"><button class="plusadd" type="button">+</button></div><div class="equals">0</div><input class="rate" type="number" inputmode="decimal" value="123"><b class="total">BDT 0.00</b><button class="del" type="button">×</button>';
 a.querySelector(".accountname").textContent=name+" "+n;box.appendChild(a);updateGroup(group);calculate();
}
function createGroup(name){
 var g=document.createElement("div");g.className="group";g.dataset.name=name;
 g.innerHTML='<div class="grouphead"><div class="groupname"><span class="appicon"></span><span class="gtitle"></span></div><button class="add" type="button">+</button></div><div class="accounts"></div>';
 g.querySelector(".add").onclick=function(){createAccount(g,name)};
 groups.appendChild(g);createAccount(g,name);
}
function updateGroup(g){
 var acc=g.querySelectorAll(".account"),name=g.dataset.name;
 g.querySelector(".gtitle").textContent=name+" ("+acc.length+")";
 acc.forEach(function(a,i){a.querySelector(".accountname").textContent=name+" "+(i+1)});
}
function refreshMenu(){
 menu.innerHTML="";
 var existing={};groups.querySelectorAll(".group").forEach(function(g){existing[g.dataset.name]=true});
 defaultApps.forEach(function(name){
  if(!existing[name]){
   var b=document.createElement("button");b.type="button";b.textContent="+  "+name;
   b.onclick=function(){createGroup(name);menu.classList.remove("open");refreshMenu()};
   menu.appendChild(b);
  }
 });
 var custom=document.createElement("button");custom.type="button";custom.textContent="+  Custom App";
 custom.onclick=function(){var n=prompt("Enter app name:");if(n&&n.trim()){createGroup(n.trim());menu.classList.remove("open");refreshMenu()}};
 menu.appendChild(custom);
}
function calculate(){
 var U=0,B=0;
 groups.querySelectorAll(".account").forEach(function(a){
  var u=parsePlus(a.querySelector(".usd").value),r=Number(a.querySelector(".rate").value)||0,t=u*r;
  a.querySelector(".equals").textContent=u.toLocaleString("en-US",{maximumFractionDigits:2});
  a.querySelector(".total").textContent=fmtBDT(t);U+=u;B+=t;
 });
 document.getElementById("usdTotal").textContent=fmtUSD(U);document.getElementById("bdtTotal").textContent=fmtBDT(B);
}
document.addEventListener("input",function(e){
 if(e.target.classList.contains("usd")){e.target.parentElement.querySelector(".plusadd").classList.toggle("show",e.target.value.trim()!=="");calculate()}
 if(e.target.classList.contains("rate"))calculate();
});
document.addEventListener("click",function(e){
 if(e.target.classList.contains("plusadd")){var i=e.target.parentElement.querySelector(".usd");if(i.value.trim()!==""){i.value=i.value.trim()+"+";e.target.classList.remove("show");i.focus();calculate()}}
 if(e.target.classList.contains("del")){
  var g=e.target.closest(".group"),box=g.querySelector(".accounts"),a=e.target.closest(".account");
  if(box.children.length>1){a.remove();updateGroup(g)}else{g.remove()}
  refreshMenu();calculate();
 }
});
document.getElementById("addApp").onclick=function(e){e.stopPropagation();refreshMenu();menu.classList.toggle("open")};
document.addEventListener("click",function(e){if(!e.target.closest(".addwrap"))menu.classList.remove("open")});
document.getElementById("reset").onclick=function(){groups.innerHTML="";defaultApps.forEach(createGroup);refreshMenu();calculate()};
defaultApps.forEach(createGroup);refreshMenu();calculate();
})();
</script>
</body>
</html>
